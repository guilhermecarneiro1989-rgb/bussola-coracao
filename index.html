<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola do Coração</title>
    <style>
        body {
            background-color: #121212; 
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .compass-box {
            position: relative;
            width: 320px;
            height: 320px;
            border: 3px solid #444; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }
        .heart {
            position: absolute;
            top: -30px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            text-shadow: 0 0 15px rgba(255, 45, 85, 0.8);
            z-index: 10;
        }
        .arrow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.15s ease-out; 
        }
        .arrow {
            position: absolute;
            bottom: 50%; 
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 140px solid #ff2d55; 
        }
        .distance-text {
            margin-top: 60px;
            font-size: 24px;
            font-weight: 300;
            color: #d1d1d6;
        }
        button {
            margin-top: 30px;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background-color: #ff2d55;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.4);
        }
    </style>
</head>
<body>

    <div class="compass-box">
        <div class="heart">❤️</div>
        <div class="arrow-container" id="arrow-container">
            <div class="arrow"></div>
        </div>
    </div>
    
    <div class="distance-text">Distância: 0.1 metros</div>
    <button id="startBtn">Ativar Bússola</button>

    <script>
        // Variável que vai guardar a direção inicial
        let direcaoAlvo = null; 

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        startCompass();
                    } else {
                        alert("Preciso de permissão para a bússola!");
                    }
                } catch (e) { console.error(e); }
            } else { 
                startCompass(); 
            }
            document.getElementById('startBtn').style.display = 'none';
        });

        function startCompass() {
            window.addEventListener('deviceorientation', (event) => {
                // Lê para onde o celular está apontando agora
                let heading = event.webkitCompassHeading;
                if (heading === null || heading === undefined) {
                    heading = 360 - event.alpha;
                }
                
                // Se for a primeira vez que lê (assim que clica no botão), salva essa direção como o alvo!
                if (direcaoAlvo === null) {
                    direcaoAlvo = heading;
                }
                
                // Calcula a rotação da seta (Alvo travado - Direção atual)
                let needleRotation = direcaoAlvo - heading;
                document.getElementById('arrow-container').style.transform = `rotate(${needleRotation}deg)`;
            });
        }
    </script>
</body>
</html>
