<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola do Coração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="compass-container">
        <!-- O coração fixo no topo -->
        <div id="heart-target">❤️</div>
        
        <div class="compass-circle">
            <!-- A seta vermelha gira sozinha no centro -->
            <div id="compass-needle">
                <div class="arrow-up"></div>
            </div>
        </div>
    </div>
    
    <!-- Texto inicial alterado para 0.1 metros -->
    <div id="distance">Distância: 0.1 metros</div>
    <button id="startBtn">Começar</button>

    <script>
        // === COORDENADAS DO DESTINO ===
        // Substitua pelas coordenadas reais do seu ponto final
        const targetLat = -22.9068; 
        const targetLon = -43.1729; 

        let currentLat = null;
        let currentLon = null;

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') startTracking();
                } catch (e) { console.error(e); }
            } else { startTracking(); }
            document.getElementById('startBtn').style.display = 'none';
        });

        function startTracking() {
            navigator.geolocation.watchPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
            }, (err) => console.error(err), { enableHighAccuracy: true });

            window.addEventListener('deviceorientation', (event) => {
                if (!currentLat || !currentLon) return;

                let heading = event.webkitCompassHeading || (360 - event.alpha);
                const bearing = calculateBearing(currentLat, currentLon, targetLat, targetLon);
                
                // Cálculo da rotação da agulha
                let needleRotation = bearing - heading;
                document.getElementById('compass-needle').style.transform = `rotate(${needleRotation}deg)`;
                
                const distanceKM = calculateDistance(currentLat, currentLon, targetLat, targetLon);
                
                // Lógica para mostrar em metros se for menor que 1km
                let textDistance = "";
                if (distanceKM < 1) {
                    const distanceMeters = distanceKM * 1000;
                    textDistance = `${distanceMeters.toFixed(1)} metros`;
                } else {
                    textDistance = `${distanceKM.toFixed(1)} km`;
                }
                
                document.getElementById('distance').innerHTML = `Distância: ${textDistance}`;
            });
        }

        function toRad(deg) { return deg * Math.PI / 180; }
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = toRad(lon2 - lon1);
            lat1 = toRad(lat1); lat2 = toRad(lat2);
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
