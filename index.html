<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola do Coração</title>
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #2a2a30 0%, #08080a 80%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .compass-box {
            position: relative;
            width: 320px;
            height: 320px;
            
            background: linear-gradient(145deg, #1c1c20, #151518);
            box-shadow: 
                15px 15px 35px rgba(0,0,0,0.8),
                -10px -10px 25px rgba(255,255,255,0.04),
                inset 0 0 15px rgba(0,0,0,0.9);
            border: 2px solid #2a2a30;
            border-radius: 50%;
            
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .compass-ticks {
            position: absolute;
            width: 295px;
            height: 295px;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg 3deg,
                rgba(255, 255, 255, 0.15) 3deg 4deg
            );
        }

        .direction {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #636366;
            z-index: 5;
        }
        .dir-n { top: 25px; color: #d1d1d6; } 
        .dir-s { bottom: 25px; }
        .dir-e { right: 25px; }
        .dir-w { left: 25px; }

        .amor-text {
            position: absolute;
            top: -60px; 
            left: 50%;
            transform: translateX(-50%) rotate(180deg);
            font-size: 18px; 
            white-space: nowrap; 
            font-weight: 600;
            color: #ff2d55;
            text-shadow: 0 0 15px rgba(255, 45, 85, 0.8);
            z-index: 40; 
            animation: float-inverted 3s ease-in-out infinite;
            outline: none; 
            cursor: text;
        }

        /* Ícone agora também é editável e sem borda de foco */
        .heart {
            position: absolute;
            top: -30px; 
            left: 50%;
            transform: translateX(-50%) rotate(180deg);
            font-size: 50px;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.5);
            z-index: 40; /* Aumentei para poder clicar fácil */
            animation: float-inverted 3s ease-in-out infinite;
            outline: none; 
            cursor: text;
        }

        @keyframes float-inverted {
            0% { transform: translateX(-50%) rotate(180deg) translateY(0px); }
            50% { transform: translateX(-50%) rotate(180deg) translateY(5px); }
            100% { transform: translateX(-50%) rotate(180deg) translateY(0px); }
        }

        .arrow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.15s ease-out; 
            z-index: 6;
        }

        .arrow-top {
            position: absolute;
            bottom: 50%; 
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 110px solid #ff2d55; 
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.7));
        }

        .arrow-bottom {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 50px solid #d1d1d6; 
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.7));
        }

        .center-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #e5e5ea 0%, #8e8e93 100%);
            border: 2px solid #1c1c1e;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .distance-text {
            position: relative;
            z-index: 30;
            margin-top: 60px;
            font-size: 26px;
            font-weight: 300;
            color: #f2f2f7;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; 
        }

        button {
            margin-top: 30px;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff2d55, #d91c40);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 45, 85, 0.4);
            transition: transform 0.2s;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="compass-box">
        <div class="amor-text" id="tituloEditavel" contenteditable="true" spellcheck="false">meu futuro problema</div>
        <!-- Adicionei contenteditable aqui também -->
        <div class="heart" id="iconeEditavel" contenteditable="true" spellcheck="false">😈</div>
        
        <div class="compass-ticks"></div>
        <div class="direction dir-n">N</div>
        <div class="direction dir-s">S</div>
        <div class="direction dir-e">L</div>
        <div class="direction dir-w">O</div>

        <div class="arrow-container" id="arrow-container">
            <div class="arrow-top"></div>
            <div class="arrow-bottom"></div>
        </div>
        
        <div class="center-pin"></div>
    </div>
    
    <div class="distance-text" id="resetAlvo">Distância: 0.1 metros</div>
    <button id="startBtn">Ativar Radar</button>

    <script>
        let direcaoAlvo = null; 
        let direcaoAtualLida = 0; 

        // LÓGICA PARA SALVAR O TEXTO DIGITADO
        const titulo = document.getElementById('tituloEditavel');
        const textoSalvo = localStorage.getItem('textoBussola');
        if (textoSalvo) {
            titulo.innerText = textoSalvo;
        }
        titulo.addEventListener('input', () => {
            localStorage.setItem('textoBussola', titulo.innerText);
        });

        // LÓGICA PARA SALVAR O ÍCONE DIGITADO
        const icone = document.getElementById('iconeEditavel');
        const iconeSalvo = localStorage.getItem('iconeBussola');
        if (iconeSalvo) {
            icone.innerText = iconeSalvo;
        }
        icone.addEventListener('input', () => {
            localStorage.setItem('iconeBussola', icone.innerText);
        });

        // LÓGICA DA BÚSSOLA E RADAR
        document.getElementById('startBtn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        startCompass();
                    } else {
                        alert("Preciso de permissão para o radar funcionar!");
                    }
                } catch (e) { console.error(e); }
            } else { 
                startCompass(); 
            }
            document.getElementById('startBtn').style.display = 'none';
        });

        document.getElementById('resetAlvo').addEventListener('click', () => {
            if (direcaoAlvo !== null) {
                direcaoAlvo = direcaoAtualLida;
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            }
        });

        function startCompass() {
            window.addEventListener('deviceorientation', (event) => {
                let heading = event.webkitCompassHeading;
                if (heading === null || heading === undefined) {
                    heading = 360 - event.alpha;
                }
                
                direcaoAtualLida = heading;
                
                if (direcaoAlvo === null) {
                    direcaoAlvo = heading;
                }
                
                let needleRotation = direcaoAlvo - heading;
                document.getElementById('arrow-container').style.transform = `rotate(${needleRotation}deg)`;
            });
        }
    </script>
</body>
</html>
